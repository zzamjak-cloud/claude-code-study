# StyleStudio 릴리스 워크플로우
# 버전 태그 푸시 시 macOS/Windows 빌드 및 GitHub Releases 업로드

name: Release StyleStudio

on:
  push:
    tags:
      - 'stylestudio-v*'  # stylestudio-v1.0.0 형식의 태그에 반응

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon + Intel Universal)
          - platform: macos-latest
            args: --target universal-apple-darwin
          # Windows
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: ./StyleStudio-Tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: StyleStudio-Tauri/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      # .env 파일 생성 (OAuth 환경 변수)
      - name: Create .env file
        run: |
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.STYLESTUDIO_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.STYLESTUDIO_GOOGLE_CLIENT_SECRET }}" >> .env
          echo "VITE_ALLOWED_DOMAIN=${{ secrets.STYLESTUDIO_ALLOWED_DOMAIN }}" >> .env

      # Base64로 인코딩된 키를 디코딩하여 환경 변수로 설정
      - name: Decode signing key (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        run: |
          echo "${{ secrets.STYLESTUDIO_SIGNING_KEY_BASE64 }}" | base64 --decode > /tmp/signing_key.txt
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat /tmp/signing_key.txt)" >> $GITHUB_ENV
        working-directory: .

      - name: Decode signing key (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $key = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.STYLESTUDIO_SIGNING_KEY_BASE64 }}"))
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
        working-directory: .

      - name: Build and Release (macOS without Apple signing)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.STYLESTUDIO_SIGNING_KEY_PASSWORD }}
          # Apple 코드 서명 비활성화 (인증서 없음)
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: ./StyleStudio-Tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'StyleStudio ${{ github.ref_name }}'
          releaseBody: |
            ## StyleStudio v0.1.8 업데이트

            ### ✨ 새로운 기능

            #### 📁 폴더 저장 기능
            - 세션을 폴더로 분류하여 관리할 수 있습니다
            - 폴더 생성, 이름 변경, 삭제 기능 지원
            - 드래그 앤 드롭으로 세션을 폴더 간 이동 가능

            #### 🎨 일러스트 세션 추가
            - 여러 명의 캐릭터를 이름으로 등록하고 참조 이미지 추가
            - 캐릭터별 최대 3장의 참조 이미지 지원
            - 배경 스타일 참조 이미지 추가 가능
            - 프롬프트에서 캐릭터 이름으로 참조하여 일러스트 생성

            #### 📷 카메라 앵글 & 렌즈/화각 설정
            - 20가지 카메라 앵글 프리셋 (눈높이, 하이앵글, 로우앵글, 버드아이 뷰 등)
            - 15가지 렌즈/화각 프리셋 (14mm~200mm, 매크로, 어안 렌즈 등)
            - 설정이 히스토리에 저장되어 복원 가능

            ### 설치 방법
            - **macOS**: `.dmg` 파일을 다운로드하여 Applications 폴더에 드래그
            - **Windows**: `.msi` 파일을 다운로드하여 실행

            ---
            _자동 생성된 릴리스입니다._
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and Release (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.STYLESTUDIO_SIGNING_KEY_PASSWORD }}
        with:
          projectPath: ./StyleStudio-Tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'StyleStudio ${{ github.ref_name }}'
          releaseBody: |
            ## StyleStudio v0.1.8 업데이트

            ### ✨ 새로운 기능

            #### 📁 폴더 저장 기능
            - 세션을 폴더로 분류하여 관리할 수 있습니다

            #### 🎨 일러스트 세션 추가
            - 여러 명의 캐릭터를 등록하고 일러스트 생성

            #### 📷 카메라 앵글 & 렌즈/화각 설정
            - 다양한 카메라 앵글 및 렌즈 프리셋 지원
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 롤링 릴리스 업데이트 (자동 업데이트용 고정 URL)
  update-latest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download latest.json from versioned release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 버전 릴리스에서 latest.json 다운로드
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "latest.json" \
            --dir ./artifacts

      - name: Update rolling release (stylestudio-latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 기존 롤링 릴리스 삭제 (있으면)
          gh release delete stylestudio-latest \
            --repo "${{ github.repository }}" \
            --yes || true

          # 기존 태그 삭제 (있으면)
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/stylestudio-latest" || true

          # 새 롤링 릴리스 생성
          gh release create stylestudio-latest \
            --repo "${{ github.repository }}" \
            --title "StyleStudio Latest (Auto-Update)" \
            --notes "자동 업데이트용 릴리스입니다. 직접 다운로드하지 마세요. 최신 버전: ${{ github.ref_name }}" \
            --prerelease \
            ./artifacts/latest.json
